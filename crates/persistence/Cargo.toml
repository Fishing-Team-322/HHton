[package]
name = "persistence"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "macros", "postgres", "migrate", "chrono", "uuid"] }
core-domain = { path = "../core-domain" }
chrono = { version = "0.4", features = ["clock"] }
serde_json = "1"
contracts = { path = "../contracts" }
ratings = { path = "../ratings" }
uuid = { version = "1", features = ["v4"] }
