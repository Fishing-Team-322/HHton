version: "3.9"

services:
  app:
    build:
      context: .
      target: runtime
    image: hhton/service:latest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      repo-proof:
        condition: service_started
    environment:
      RUST_LOG: info
      SERVICE_BIN: hackcore-server
      REPO_PROOF_ENDPOINT: http://repo-proof:50060
      DATABASE_URL: postgres://hhton:hhton@postgres:5432/hhton
      PERSISTENCE__DATABASE__URL: postgres://hhton:hhton@postgres:5432/hhton
      PERSISTENCE__MIGRATIONS_DIR: /srv/app/migrations
      STORAGE__S3__ENDPOINT: http://minio:9000
      STORAGE__S3__REGION: us-east-1
      STORAGE__S3__BUCKET: hhton-dev
      STORAGE__S3__ACCESS_KEY_ID: hhton
      STORAGE__S3__SECRET_ACCESS_KEY: hhtonsecret
      STORAGE__S3__PATH_STYLE: "true"
      STORAGE__S3__USE_SSL: "false"
      AWS_ACCESS_KEY_ID: hhton
      AWS_SECRET_ACCESS_KEY: hhtonsecret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: hhton-dev
      QUEUE__REDIS__URL: redis://redis:6379/0
    ports:
      - "50051:50051"
    command: []

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hhton
      POSTGRES_PASSWORD: hhton
      POSTGRES_DB: hhton
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hhton
      MINIO_ROOT_PASSWORD: hhtonsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: quay.io/minio/mc:RELEASE.2024-05-10T03-26-08Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 hhton hhtonsecret &&
      mc mb --ignore-existing local/hhton-dev

  repo-proof:
    image: hhton/service:latest
    environment:
      SERVICE_BIN: repo-proof-server
      RUST_LOG: info
      REPO_PROOF_LISTEN_ADDR: 0.0.0.0:50060
    expose:
      - "50060"

  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      SWAGGER_JSON: /usr/share/nginx/html/openapi.yaml
    volumes:
      - ./cpp/services/hackathon-config/openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    ports:
      - "8081:8080"

volumes:
  postgres-data:
  minio-data:
