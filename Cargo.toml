[workspace]
members = [
    "crates/core-domain",
    "crates/repo-proof",
    "crates/ratings",
    "crates/persistence",
    "crates/storage",
    "crates/hooks",
    "crates/search",
    "crates/contracts",
    "crates/hackcore-server",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
serde_json = "1.0"
tracing = "0.1"
