name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:

jobs:
  build:
    name: Lint, test, and validate migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: hhton
          POSTGRES_PASSWORD: hhton
          POSTGRES_DB: hhton
        options: >-
          --health-cmd "pg_isready -U hhton"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: hhton
          MINIO_ROOT_PASSWORD: hhtonsecret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"
    env:
      DATABASE_URL: postgres://hhton:hhton@localhost:${{ job.services.postgres.ports['5432'] }}/hhton
      AWS_ACCESS_KEY_ID: hhton
      AWS_SECRET_ACCESS_KEY: hhtonsecret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:${{ job.services.minio.ports['9000'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.7.4 --no-default-features --features rustls,postgres --locked

      - name: Wait for dependencies
        env:
          PGPASSWORD: hhton
        run: |
          until pg_isready -h localhost -p ${{ job.services.postgres.ports['5432'] }} -U hhton; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 1
          done
          until curl -sf http://127.0.0.1:${{ job.services.minio.ports['9000'] }}/minio/health/live > /dev/null; do
            echo "Waiting for MinIO to be ready..."
            sleep 1
          done

      - name: Provision MinIO bucket
        run: |
          curl -sSfL https://dl.min.io/client/mc/release/linux-amd64/mc -o mc
          sudo install -m 755 mc /usr/local/bin/mc
          rm mc
          mc alias set local http://127.0.0.1:${{ job.services.minio.ports['9000'] }} hhton hhtonsecret
          mc mb --ignore-existing local/hhton-dev

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check SQLx migrations
        run: sqlx migrate run --source crates/persistence/migrations --database-url "$DATABASE_URL"

      - name: Run tests
        run: cargo test --all --all-features
